                            <p><strong>Procedure:</strong></p>

                                <li>Remove the cause if possible, or remove the victim from the cause</li>
                                <li>Ensure victim's airways are open:
                                    <ul>
                                        <li>Place victim on back</li>
                                        <li>With one hand on forehead and other on chin, tilt head backwards</li>

                                </li>
                                <li>Blow air into airways using clean material (cloth or paper)</li>
                                <li>Compress chest with both hands</li>
                                <li>Keep victim warm using light blanket</li>
                                <li>Take to nearby health care facility</li>
                            </ul>
                            
                            <h4>Burns</h4>
                            <p><strong>Definition:</strong> Injuries from body coming into contact with heat or harmful chemicals</p>
                            <p><strong>Scalds:</strong> Burns caused by hot liquids or vapour</p>
                            <p><strong>Procedure:</strong></p>
                            <ul>
                                <li>Lay victim down, protect burnt area from ground</li>
                                <li>Gently pour cold water on burn for about 10 minutes</li>
                                <li>Check breathing and pulse</li>
                                <li>Gently remove jewellery, shoes or burnt clothing (not sticking to skin)</li>
                                <li>Cover burn with sterile gauze, wrap loosely</li>
                                <li>Give pain reliever</li>
                                <li>Take to health care facility</li>
                            </ul>
                            <div class="warning-box">
                                <strong>DON'TS:</strong>
                                <ul>
                                    <li>Do not use ice (further damages skin)</li>
                                    <li>Do not apply ointment or butter</li>
                                    <li>Do not break blisters (can cause infections)</li>
                                </ul>
                            </div>
                            
                            <h4>Choking</h4>
                            <p><strong>Definition:</strong> Blockage of upper airways by food, drink or other objects</p>
                            <p><strong>Procedure:</strong></p>
                            <ul>
                                <li>Encourage victim to cough up object</li>
                                <li>If object remains stuck, give gentle taps between shoulder blades</li>
                                <li>If still stuck, perform Heimlich manoeuvre:
                                    <ul>
                                        <li>Make person lean forward slightly, stand behind</li>
                                        <li>Make fist with one hand, grasp with other near top of stomach</li>

                            <p><strong>Definition:</strong> Occurs when person comes into contact with electric current</p>

                                <strong>CAUTION:</strong> Do not touch person still in contact with electric current

                            <p><strong>Definition:</strong> Any substance that can harm body if swallowed, inhaled or absorbed through skin</p>
                            <p><strong>Procedure:</strong></p>
                            <ul>

                            <h4>Principles of Separation</h4>
                            <ul>
                                <li>Many mixtures contain useful substances mixed with unwanted materials (impurities)</li>
                                <li>Separation method depends on components and their properties</li>
                            </ul>
                            
                            <h4>1. Decantation</h4>
                            <p><strong>Definition:</strong> Process of separating a heterogeneous mixture of liquid and solid by pouring out the liquid only, leaving solid at bottom</p>
                            <p><strong>Process:</strong></p>
                            <ul>
                                <li>Sedimentation - components settle at bottom first</li>
                                <li>Pour out clear water from top</li>
                            </ul>
                            <p><strong>Works best when:</strong> Solid particles are large</p>
                            <p><strong>Example:</strong> Separating clear water from muddy water</p>
                            
                            <h4>2. Filtration</h4>
                            <p><strong>Definition:</strong> Method to separate heterogeneous mixture of solid and liquid using porous filter</p>
                            <p><strong>Components:</strong></p>
                            <ul>
                                <li><strong>Residue</strong> - solid obtained</li>
                                <li><strong>Filtrate</strong> - liquid obtained</li>
                            </ul>
                            <p><strong>Example:</strong> Separating sand from water</p>
                            
                            <h4>3. Evaporation</h4>
                            <p><strong>Definition:</strong> Process of separating solute from liquid solution through heating</p>
                            <p><strong>Process:</strong></p>
                            <ul>
                                <li>Solvent converts from liquid to gas through heating</li>
                                <li>Solute remains as residue</li>
                            </ul>
                            <p><strong>Example:</strong> Obtaining salt from salt solution</p>
                            
                            <h4>4. Distillation</h4>
                            <p><strong>Definition:</strong> Process of separating components by heating a liquid to suitable temperature until it forms vapour, then cooling back to liquid</p>
                            <p><strong>Distillate:</strong> Liquid from cooled vapour</p>
                            
                            <h5>Types:</h5>
                            <p><strong>a) Simple Distillation</strong></p>
                            <ul>
                                <li>Obtaining a single liquid from suspension or solution</li>
                                <li>Example: distilling clean water from muddy water</li>
                            </ul>
                            
                            <p><strong>b) Fractional Distillation</strong></p>
                            <ul>
                                <li>Separating homogeneous mixture of two or more miscible liquids</li>
                                <li>Uses fractionating column</li>
                                <li>Liquids must have reasonable difference in boiling points</li>
                                <li>Component with lower boiling point distils first</li>
                                <li>Each component collected is a fraction</li>
                                <li>Example: separating ethanol and water</li>
                            </ul>
                            
                            <h4>5. Layer Separation</h4>
                            <p><strong>Definition:</strong> Method for separating immiscible liquids using separating funnel</p>
                            <p><strong>Process:</strong></p>
                            <ul>
                                <li>Most dense liquid settles at bottom</li>
                                <li>Least dense remains at top</li>
                                <li>Open tap, bottom liquid released first</li>
                            </ul>
                            <p><strong>Example:</strong> Separating kerosene from water, oil from water</p>
                            
                            <h4>6. Sublimation</h4>
                            <p><strong>Definition:</strong> Process where solid changes directly to gas on heating</p>
                            <p><strong>Sublimate:</strong> Solid that forms when vapour cools</p>
                            <p><strong>Used when:</strong> One substance in mixture sublimes</p>
                            <p><strong>Examples:</strong> Iodine, ammonium chloride</p>
                            
                            <h4>7. Chromatography</h4>
                            <p><strong>Definition:</strong> Process of separating mixtures using a solvent (mobile phase) and an immobile substance (stationary phase)</p>
                            
                            <h5>Terms:</h5>
                            <ul>
                                <li><strong>Mobile phase:</strong> moving solvent (liquid or gas)</li>
                                <li><strong>Stationary phase:</strong> immobile substance (solid or liquid on solid)</li>
                                <li><strong>Analyte:</strong> substance being separated</li>
                            </ul>
                            
                            <h5>Types:</h5>
                            <ul>
                                <li>Paper chromatography</li>
                                <li>Thin layer chromatography</li>
                                <li>Gas chromatography</li>
                            </ul>
                            
                            <h5>Paper Chromatography:</h5>
                            <ul>
                                <li>Stationary phase: uniform adsorbent paper</li>
                                <li>Mobile phase: suitable liquid solvent</li>
                            </ul>
                            
                            <h5>Uses of Chromatography:</h5>
                            <ul>
                                <li>Separate components of mixture</li>
                                <li>Identification and quantification of chemical substances</li>
                                <li>Analyse drugs in blood and urine samples</li>
                                <li>Detect causes of pollution in water, soil, air and organisms</li>
                            </ul>
                            
                            <h4>8. Solvent Extraction</h4>
                            <p><strong>Definition:</strong> Separation of compounds from materials using liquids in which they are soluble</p>
                            
                            <h5>Criteria for Solvent Selection:</h5>
                            <ul>
                                <li>Solvent should dissolve component of interest</li>
                                <li>Solvent must not react with component of interest</li>
                                <li>Solution formed must allow easy separation of desired component</li>
                            </ul>
                            
                            <p><strong>Example:</strong> Extracting oil from groundnuts using ethanol, then fractional distillation to separate ethanol from oil</p>
                        `
                    }
                ]
            }
        ];

        // Render chapters
        function renderChapters() {
            const grid = document.getElementById('chaptersGrid');
            let html = '';
            
            chapters.forEach(chapter => {
                html += `
                    <div class="chapter-card" onclick="openChapter(${chapter.id})">
                        <div class="chapter-number">CHAPTER ${chapter.id}</div>
                        <h3>${chapter.title}</h3>
                        <p>${chapter.topics.length} topics • Complete notes</p>
                        <span class="topic-count">View Chapter →</span>
                    </div>
                `;
            });
            
            grid.innerHTML = html;
        }

        // Open chapter
        function openChapter(id) {
            const chapter = chapters.find(c => c.id === id);
            
            document.getElementById('modalTitle').textContent = `CHAPTER ${id}: ${chapter.title}`;
            document.getElementById('modalInfo').textContent = `${chapter.topics.length} topics • Based on TIE Student's Book Form One`;
            
            let html = '';
            
            chapter.topics.forEach(topic => {
                html += `
                    <div class="topic">
                        <h3>${topic.number} ${topic.title}</h3>
                        ${topic.content}
                    </div>
                `;
            });
            
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('chapterModal').classList.add('active');
        }

        // Close modal
        function closeModal() {
            document.getElementById('chapterModal').classList.remove('active');
        }

        // Open AI chat (placeholder)
        function openAIChat() {
            alert('KRYNOX42 AI Chat itaongezwa hivi karibuni! Kwa sasa unaweza kusoma notes zote za chemistry.');
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('chapterModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        // Initialize
        renderChapters();
    </script>
